# Configuracion de Alembic.
#
# NO contiene ninguna URL de base de datos: la cadena de conexion la resuelve
# alembic/env.py a partir de la configuracion de la aplicacion, que la lee del
# entorno.  Poner una URL aqui invitaria a que alguien escribiera una
# contrasena real en un archivo versionado.

[alembic]
script_location = alembic
prepend_sys_path = .
# Nombre de archivo con fecha: el orden alfabetico coincide con el
# cronologico, lo que hace legible el directorio de versiones.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# Formatea la migracion generada para que cumpla el estilo del proyecto y no
# haga fallar el linter en el pipeline.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
