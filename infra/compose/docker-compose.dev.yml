# ---------------------------------------------------------------------------
#  Infraestructura de datos para desarrollo local.
#
#  Se ejecuta DENTRO de WSL2 (ver ADR-0002).  Desde PowerShell use
#  infra/scripts/infra-arriba.ps1, que hace la traduccion de rutas.
#
#  Los limites de memoria son deliberadamente bajos: el equipo de desarrollo
#  tiene ~2.8 GB de RAM libres con MSSQLSERVER activo (riesgo R-02).
# ---------------------------------------------------------------------------

name: clinica-dev

services:
  postgres:
    # Imagen oficial de pgvector sobre PostgreSQL 16.  Trae la extension
    # `vector` compilada, que es justo lo que no se puede construir de forma
    # nativa en este equipo por falta de MSVC.
    image: pgvector/pgvector:pg16
    container_name: clinica-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_BD:-clinica}
      POSTGRES_USER: ${POSTGRES_USUARIO:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_CONTRASENA:?debe definirse en .env}
      # Proveedor de collation ICU con locale espanol.
      #
      # La imagen de pgvector es Debian slim y solo tiene generados los
      # locales C, C.utf8, en_US.utf8 y POSIX: `--locale=es_ES.UTF-8` hace
      # fallar initdb con "invalid locale name".
      #
      # ICU resuelve el problema mejor que generar el locale del sistema:
      # da ordenacion correcta en espanol (la enye despues de la n, tildes
      # tratadas como la letra base) sin depender de que la imagen tenga el
      # locale compilado.  Importa para ordenar apellidos de pacientes.
      #
      # LC_CTYPE queda en C.UTF-8, que es lo recomendado con el proveedor ICU.
      # La busqueda textual en espanol no depende de esto: usa la
      # configuracion `spanish` de snowball mas `unaccent` (ver el script de
      # inicializacion), que son independientes del locale del sistema.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-ES --locale=C.UTF-8"
      TZ: UTC
    ports:
      # Se publica en todas las interfaces DE LA DISTRIBUCION WSL, no del
      # equipo.  Es necesario porque el reenvio de localhost de WSL2 solo
      # relaya los puertos que escuchan en 0.0.0.0 dentro de la maquina
      # virtual; con 127.0.0.1 el servicio queda inalcanzable desde
      # Windows.  En modo NAT la distribucion esta detras de un conmutador
      # privado, asi que el alcance real sigue siendo este equipo.
      # Ver la nota de red en infra/wsl/wslconfig.ejemplo.
      - "5432:5432"
    volumes:
      # Volumen nombrado, dentro del sistema de archivos ext4 de WSL.
      # No se usa un montaje de /mnt/d a proposito: el rendimiento de
      # entrada/salida de PostgreSQL sobre el sistema de archivos de Windows
      # es muy inferior.
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      # Ajustes moderados para un equipo con poca memoria libre
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      # 200: las pruebas de concurrencia abren 50 conexiones y en desarrollo
      # conviven la API, el worker y servidores de pruebas con su propio pool.
      - -c
      - max_connections=200
      - -c
      - timezone=UTC
      # Registro de consultas lentas: util para las pruebas de carga
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      # Necesario para que las pruebas de concurrencia vean los bloqueos
      - -c
      - deadlock_timeout=1s
    healthcheck:
      # La comprobacion no se limita a que el puerto responda: verifica que
      # las extensiones existan.  Un PostgreSQL sano sin pgvector no sirve.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USUARIO:-clinica} -d ${POSTGRES_BD:-clinica}
          && psql -U ${POSTGRES_USUARIO:-clinica} -d ${POSTGRES_BD:-clinica}
          -tAc "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: clinica-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command:
      - redis-server
      # Persistencia AOF activada.  Redis no es la fuente de verdad (el
      # outbox de PostgreSQL lo es, ver ADR-0008), pero perder la cola en
      # cada reinicio complicaria el desarrollo sin necesidad.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      # noeviction, no allkeys-lru: preferimos que una escritura falle de
      # forma visible antes que perder en silencio un trabajo programado.
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # Almacen S3 compatible para imagenes clinicas. Recibe bytes ya cifrados
    # por la aplicacion: aunque se copie el volumen, no hay imagen en claro.
    # Perfil propio: no arranca con `infra-arriba` salvo que se pida
    # (`--profile archivos`). Con ALMACENAMIENTO_ARCHIVOS=local no hace falta.
    profiles: ["archivos"]
    image: minio/minio:latest
    container_name: clinica-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_CLAVE_ACCESO:-}
      MINIO_ROOT_PASSWORD: ${S3_CLAVE_SECRETA:-}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      # Consola web solo para desarrollo.
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clamav:
    # Antivirus para las imagenes subidas (protocolo INSTREAM, puerto 3310).
    # Mismo perfil que MinIO: la firma de virus ocupa ~1 GB de RAM, demasiado
    # para arrancarlo siempre en este equipo (riesgo R-02). Con
    # ANTIVIRUS_HABILITADO=true el backend lo exige; sin el, en desarrollo
    # registra NO_DISPONIBLE y en produccion rechaza la carga.
    profiles: ["archivos"]
    image: clamav/clamav:stable
    container_name: clinica-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1400M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clamavdata:
    name: clinica-dev-clamavdata
  miniodata:
    name: clinica-dev-miniodata
  pgdata:
    name: clinica-dev-pgdata
  redisdata:
    name: clinica-dev-redisdata
